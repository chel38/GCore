name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    name: Lua syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
          sudo update-alternatives --install /usr/local/bin/lua lua /usr/bin/lua5.4 100
          sudo update-alternatives --install /usr/local/bin/luac luac /usr/bin/luac5.4 100

      - name: Validate repository contracts
        shell: pwsh
        run: ./tools/validate-repository.ps1

      - name: Run unit, integration, security, and runtime tests
        run: lua tools/test_harness.lua .

      - name: Run independent module test suites
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module_path; do
            module_name="$(basename "$module_path")"
            lua tools/module_test_harness.lua . "$module_name"
          done < <(find 'resources/[greencore]' -mindepth 1 -maxdepth 1 -type d -name 'gc_*' ! -name 'gc_core' | sort)

  identity-nui:
    name: gc_identity NUI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: resources/[greencore]/gc_identity/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact NUI dependencies
        run: pnpm install --frozen-lockfile

      - name: Run NUI tests
        run: pnpm test

      - name: Build production NUI
        run: pnpm build

      - name: Verify committed build is current
        working-directory: .
        run: git diff --exit-code -- resources/[greencore]/gc_identity/web/dist
