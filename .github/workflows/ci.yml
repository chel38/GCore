name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  discover-modules:
    name: Discover Module Standard resources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.discovery.outputs.modules }}
      nui: ${{ steps.discovery.outputs.nui }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
          sudo update-alternatives --install /usr/local/bin/lua lua /usr/bin/lua5.4 100

      - name: Build dynamic module matrices
        id: discovery
        shell: bash
        run: |
          set -euo pipefail
          echo "modules=$(lua tools/discover_modules.lua . --json | jq -c '.')" >> "$GITHUB_OUTPUT"
          echo "nui=$(lua tools/discover_modules.lua . --json --nui | jq -c '.')" >> "$GITHUB_OUTPUT"

  lua:
    name: Lua syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
          sudo update-alternatives --install /usr/local/bin/lua lua /usr/bin/lua5.4 100
          sudo update-alternatives --install /usr/local/bin/luac luac /usr/bin/luac5.4 100

      - name: Validate repository contracts
        shell: pwsh
        run: ./tools/validate-repository.ps1

      - name: Run unit, integration, security, and runtime tests
        run: lua tools/test_harness.lua .

      - name: Test portable ecosystem tooling and fixtures
        run: lua tools/tests/run.lua .

      - name: Verify generated ecosystem catalog and graph
        run: lua tools/generate-ecosystem-docs.lua . --check

  modules:
    name: Module / ${{ matrix.module.resource }}
    needs: discover-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
          sudo update-alternatives --install /usr/local/bin/lua lua /usr/bin/lua5.4 100
          sudo update-alternatives --install /usr/local/bin/luac luac /usr/bin/luac5.4 100

      - name: Check Module Standard conformance
        run: lua tools/module_conformance.lua "${{ matrix.module.path }}"

      - name: Run module-owned tests
        run: lua tools/module_test_harness.lua . "${{ matrix.module.path }}"

  module-nui:
    name: NUI / ${{ matrix.module.resource }}
    needs: discover-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.nui) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact NUI dependencies
        working-directory: ${{ matrix.module.path }}/web
        run: pnpm install --frozen-lockfile

      - name: Run NUI tests
        working-directory: ${{ matrix.module.path }}/web
        run: pnpm run --if-present test

      - name: Build production NUI
        working-directory: ${{ matrix.module.path }}/web
        run: pnpm build

      - name: Verify committed build is current
        run: git diff --exit-code -- "${{ matrix.module.path }}/web/dist"

  mail-service:
    name: Local mail service
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: mail-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mail-service/pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      - name: Run mail boundary tests
        run: pnpm test

      - name: Build production service
        run: pnpm build
