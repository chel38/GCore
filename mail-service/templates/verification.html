<!doctype html>
<html lang="ru">
  <body style="margin:0;padding:0;background:#050806;color:#ecfdf5;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#050806;padding:32px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;border:1px solid #1f5136;border-radius:18px;background:#0a1510">
          <tr><td style="padding:34px">
            <div style="color:#4ade80;font-size:13px;font-weight:700;letter-spacing:2px">GCORE</div>
            <h1 style="margin:12px 0 10px;color:#f0fdf4;font-size:26px">{{title}}</h1>
            <p style="margin:0 0 24px;color:#a7b8ae;line-height:1.6">{{description}}</p>
            <div style="border:1px solid #2a6948;border-radius:14px;background:#07110d;padding:20px;text-align:center">
              <div style="margin-bottom:8px;color:#86efac;font-size:12px;text-transform:uppercase;letter-spacing:1.5px">Код подтверждения</div>
              <div style="color:#f0fdf4;font-family:Consolas,monospace;font-size:38px;font-weight:700;letter-spacing:8px">{{code}}</div>
            </div>
            <p style="margin:22px 0 0;color:#718078;font-size:13px;line-height:1.6">Код действует ограниченное время. GCore никогда не попросит сообщить его другому человеку.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
